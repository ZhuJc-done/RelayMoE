[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relaymoe"
version = "0.2.0"
description = "RelayMoE offline catalog, online planner, event-driven simulator, and MoE runtime interface"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
relaymoe = "relaymoe.cli:main"
relaymoe-sim = "relaymoe.cli:main"

[tool.setuptools.packages.find]
include = ["relaymoe*"]
